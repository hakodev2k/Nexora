name: Agent baseline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  agent-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify agent instructions and gate regressions
        run: python3 .ai/scripts/verify-baseline.py
